<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Glow -->
    <radialGradient id="canvasGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="70%" stop-color="#FAF2E6"/>
      <stop offset="100%" stop-color="#F2E6D5"/>
    </radialGradient>

    <!-- Elephant Skin Gradient (Warm Archival Clay/Grey) -->
    <linearGradient id="elephantSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="50%" stop-color="#EBE2D5"/>
      <stop offset="100%" stop-color="#D6C7B5"/>
    </linearGradient>

    <!-- Ear Inner Warmth -->
    <radialGradient id="earInner" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F7C9BC"/>
      <stop offset="70%" stop-color="#EEA896"/>
      <stop offset="100%" stop-color="#DE8C78"/>
    </radialGradient>

    <!-- Bandana Terracotta Gradient -->
    <linearGradient id="bandanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA6842"/>
      <stop offset="60%" stop-color="#D95C38"/>
      <stop offset="100%" stop-color="#B84220"/>
    </linearGradient>

    <!-- Amber Glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD175"/>
      <stop offset="100%" stop-color="#E59430"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="charShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5C3420" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3D1E0E" flood-opacity="0.08"/>
    </filter>

    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A1F12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="680" rx="36" fill="url(#canvasGlow)"/>

  <!-- Subtle Ground Shadow -->
  <ellipse cx="300" cy="610" rx="160" ry="20" fill="#E2D1BF" opacity="0.75"/>

  <!-- Mascot Character Container -->
  <g filter="url(#charShadow)">

    <!-- BACK EARS (Left & Right) -->
    <!-- Left Ear -->
    <g transform="translate(145, 270) rotate(-12)">
      <ellipse cx="0" cy="0" rx="90" ry="105" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      <ellipse cx="10" cy="0" rx="64" ry="78" fill="url(#earInner)" opacity="0.85"/>
    </g>

    <!-- Right Ear -->
    <g transform="translate(455, 270) rotate(12)">
      <ellipse cx="0" cy="0" rx="90" ry="105" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      <ellipse cx="-10" cy="0" rx="64" ry="78" fill="url(#earInner)" opacity="0.85"/>
    </g>

    <!-- MAIN BODY (Chubby & Lovable) -->
    <g id="body">
      <!-- Body Mass -->
      <ellipse cx="300" cy="450" rx="155" ry="145" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      
      <!-- Belly Highlight (Warmer Cream) -->
      <ellipse cx="300" cy="465" rx="110" ry="95" fill="#FAF5ED" opacity="0.6"/>

      <!-- Back Feet (Sitting Pose) -->
      <g id="feet">
        <!-- Left Foot Pad -->
        <g transform="translate(180, 560)">
          <ellipse cx="0" cy="0" rx="48" ry="32" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
          <ellipse cx="0" cy="4" rx="34" ry="22" fill="#FAF5ED"/>
          <!-- Toes -->
          <circle cx="-18" cy="2" r="7" fill="#E8D9C5"/>
          <circle cx="0" cy="-4" r="8" fill="#E8D9C5"/>
          <circle cx="18" cy="2" r="7" fill="#E8D9C5"/>
        </g>
        
        <!-- Right Foot Pad -->
        <g transform="translate(420, 560)">
          <ellipse cx="0" cy="0" rx="48" ry="32" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
          <ellipse cx="0" cy="4" rx="34" ry="22" fill="#FAF5ED"/>
          <!-- Toes -->
          <circle cx="-18" cy="2" r="7" fill="#E8D9C5"/>
          <circle cx="0" cy="-4" r="8" fill="#E8D9C5"/>
          <circle cx="18" cy="2" r="7" fill="#E8D9C5"/>
        </g>
      </g>
    </g>

    <!-- WARM BANDANA / NECKERCHIEF -->
    <g id="bandana" transform="translate(300, 395)">
      <!-- Main Folded Scarf Band -->
      <path d="M -115 -18 Q 0 10 115 -18 Q 0 75 -115 -18 Z" fill="url(#bandanaGrad)" stroke="#B84220" stroke-width="2"/>
      <!-- Knotted Ribbon Tie -->
      <ellipse cx="0" cy="28" rx="14" ry="10" fill="#EA6842"/>
      <path d="M -8 32 L -18 64 L 0 54 L 18 64 L 8 32 Z" fill="#D95C38"/>
      <!-- Amber Polka Dots -->
      <circle cx="-60" cy="0" r="5" fill="url(#amberGlow)"/>
      <circle cx="-25" cy="14" r="6" fill="url(#amberGlow)"/>
      <circle cx="25" cy="14" r="6" fill="url(#amberGlow)"/>
      <circle cx="60" cy="0" r="5" fill="url(#amberGlow)"/>
      <circle cx="0" cy="38" r="4" fill="url(#amberGlow)"/>
    </g>

    <!-- HEAD & FACE -->
    <g id="head">
      <!-- Head Base -->
      <circle cx="300" cy="260" r="135" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      
      <!-- Cute Little Forehead Tuft / Hair -->
      <path d="M 292 128 Q 295 105 305 110 Q 300 128 308 128" fill="none" stroke="#D6C7B5" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Expressive Joyful Eyes -->
      <!-- Left Eye -->
      <g transform="translate(245, 235)">
        <ellipse cx="0" cy="0" rx="16" ry="22" fill="#2C201A"/>
        <!-- Catchlights -->
        <circle cx="5" cy="-6" r="6.5" fill="#FFFFFF"/>
        <circle cx="-3" cy="8" r="3.5" fill="#FFFFFF"/>
        <!-- Soft Eyelash Smile -->
        <path d="M -14 -18 Q 0 -26 14 -18" fill="none" stroke="#2C201A" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Right Eye -->
      <g transform="translate(355, 235)">
        <ellipse cx="0" cy="0" rx="16" ry="22" fill="#2C201A"/>
        <!-- Catchlights -->
        <circle cx="5" cy="-6" r="6.5" fill="#FFFFFF"/>
        <circle cx="-3" cy="8" r="3.5" fill="#FFFFFF"/>
        <!-- Soft Eyelash Smile -->
        <path d="M -14 -18 Q 0 -26 14 -18" fill="none" stroke="#2C201A" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Rosy Cheeks (Blushing Warmth) -->
      <ellipse cx="210" cy="275" rx="20" ry="12" fill="#F48F78" opacity="0.75"/>
      <ellipse cx="390" cy="275" rx="20" ry="12" fill="#F48F78" opacity="0.75"/>

      <!-- Little Gentle Smile behind trunk -->
      <path d="M 285 305 Q 300 318 315 305" fill="none" stroke="#7C4632" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- TRUNK (Belalai) Holding Polaroid Photo -->
    <g id="trunkAndPhoto">
      
      <!-- THE HELD POLAROID PHOTO -->
      <!-- Positioned lovingly near the chest/face -->
      <g transform="translate(350, 290) rotate(14)" filter="url(#photoShadow)">
        <!-- Polaroid Card -->
        <rect x="0" y="0" width="125" height="150" rx="12" fill="#FFFFFF" stroke="#EFE4D6" stroke-width="2"/>
        <!-- Inner Sunset Picture -->
        <rect x="10" y="10" width="105" height="102" rx="7" fill="#F8EADB"/>
        
        <!-- Golden Sunset Horizon inside photo -->
        <circle cx="62" cy="50" r="22" fill="#FFAF59" opacity="0.8"/>
        <path d="M 10 78 Q 45 60 75 75 T 115 68 L 115 112 L 10 112 Z" fill="#D95C38" opacity="0.85"/>
        
        <!-- Subtle Heart of Memory in photo -->
        <path d="M 62 48 C 62 48, 50 38, 50 28 C 50 20, 57 16, 62 21 C 67 16, 74 20, 74 28 C 74 38, 62 48, 62 48 Z" fill="#FFFFFF" opacity="0.9"/>
        
        <!-- Caption on Polaroid: "BIYEN" -->
        <text x="62" y="134" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" letter-spacing="2" fill="#8C5C48">BIYEN</text>
      </g>

      <!-- Trunk (Belalai) Curving up to grasp the photo gently -->
      <path d="M 282 280 
               Q 270 340 305 385 
               Q 345 425 410 395 
               Q 440 375 425 340 
               Q 410 310 375 330 
               Q 355 345 365 370" 
            fill="none" 
            stroke="url(#elephantSkin)" 
            stroke-width="36" 
            stroke-linecap="round"/>
      
      <!-- Trunk Outlines & Creases -->
      <path d="M 284 315 Q 300 322 316 315" fill="none" stroke="#CFBEAA" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 292 340 Q 308 348 324 340" fill="none" stroke="#CFBEAA" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 312 365 Q 328 373 344 365" fill="none" stroke="#CFBEAA" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Floating Memory Sparkles around Mascot -->
    <g transform="translate(150, 160)">
      <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="url(#amberGlow)"/>
    </g>
    <g transform="translate(480, 200)">
      <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="url(#amberGlow)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(490, 480)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="url(#amberGlow)" opacity="0.8"/>
    </g>

  </g>

  <!-- Mascot Title Text -->
  <text x="300" y="652" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-weight="800" 
        font-size="18" 
        letter-spacing="2.5" 
        fill="#825C4B">
    SI GANI · MASKOT BIYEN PHOTOS (GAJAH MEMORI)
  </text>
</svg>
