<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bgHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5ECE0"/>
    </linearGradient>

    <!-- Terracotta Gradient -->
    <linearGradient id="brandTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA6842"/>
      <stop offset="50%" stop-color="#DC542D"/>
      <stop offset="100%" stop-color="#BA3A15"/>
    </linearGradient>

    <!-- Amber Sparkle Gradient -->
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC966"/>
      <stop offset="100%" stop-color="#E58E26"/>
    </linearGradient>

    <filter id="hLogoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4A2818" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3A1C0E" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="280" rx="32" fill="url(#bgHGrad)"/>
  <rect width="956" height="276" x="2" y="2" rx="30" fill="none" stroke="#EFE3D5" stroke-width="2"/>

  <!-- ================= LEFT: ICON MARK (200x200) ================= -->
  <g transform="translate(56, 40)" filter="url(#hLogoShadow)">
    <!-- Base Squircle -->
    <rect width="200" height="200" rx="48" fill="#FFFFFF"/>
    <rect width="198" height="198" x="1" y="1" rx="47" fill="none" stroke="#EFE4D6" stroke-width="1.5"/>

    <!-- Subtle Orbit & Sun Sparkle inside icon -->
    <circle cx="100" cy="100" r="75" fill="none" stroke="#F0E3D3" stroke-width="1.2" stroke-dasharray="4 5"/>
    <path d="M 154 36 Q 154 44 162 44 Q 154 44 154 52 Q 154 44 146 44 Q 154 44 154 36 Z" fill="url(#brandAmber)"/>

    <!-- Polaroid in background (rotated -5deg) -->
    <g transform="rotate(-5.5 100 100)">
      <rect x="48" y="38" width="104" height="124" rx="10" fill="#FFFFFF" stroke="#EFE2D4" stroke-width="1"/>
      <rect x="56" y="46" width="88" height="88" rx="6" fill="#F8EADB"/>
      <circle cx="118" cy="72" r="12" fill="#F2B76D" opacity="0.65"/>
      <path d="M 56 108 Q 80 94 104 104 T 144 98 L 144 134 L 56 134 Z" fill="#D37E52" opacity="0.6"/>
    </g>

    <!-- Foreground: Monogram 'B' -->
    <g transform="translate(74, 52)">
      <!-- 'B' Silhouette -->
      <path d="M 6 0 L 38 0 C 54 0, 64 8, 64 22 C 64 34, 56 42, 46 46 C 60 50, 68 60, 68 76 C 68 94, 56 102, 38 102 L 6 102 C 2.68 102, 0 99.31, 0 96 L 0 6 C 0 2.68, 2.68 0, 6 0 Z" fill="url(#brandTerracotta)"/>
      
      <!-- Top Loop Cutout / Flash -->
      <circle cx="34" cy="22" r="11" fill="#FFFFFF"/>
      <circle cx="34" cy="22" r="4.5" fill="url(#brandAmber)"/>

      <!-- Bottom Loop Aperture Lens -->
      <circle cx="36" cy="74" r="18" fill="#2E1C12"/>
      <circle cx="36" cy="74" r="15" fill="#140C07"/>
      <circle cx="36" cy="74" r="7" fill="url(#brandAmber)"/>
      <circle cx="36" cy="74" r="2.5" fill="#FFFFFF"/>
      <!-- Aperture Rim Reflection -->
      <path d="M 26 67 A 13 13 0 0 1 43 64" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <!-- ================= RIGHT: WORDMARK TYPOGRAPHY ================= -->
  <g transform="translate(305, 142)">
    <!-- Main Name "Biyen" -->
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="88" 
          font-weight="800" 
          letter-spacing="-1.5" 
          fill="#2C221E">
      Biyen
    </text>

    <!-- Amber glowing dot on 'i' -->
    <circle cx="83" cy="-58" r="9" fill="url(#brandAmber)"/>

    <!-- Subtle Memory Star beside brand name -->
    <g transform="translate(295, -70)">
      <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="url(#brandAmber)"/>
    </g>

    <!-- Category Pill Badge: PHOTOS -->
    <g transform="translate(4, 38)">
      <rect width="124" height="32" rx="8" fill="#F0E3D3"/>
      <text x="62" y="22" 
            text-anchor="middle"
            font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
            font-size="14" 
            font-weight="800" 
            letter-spacing="4" 
            fill="#B8441F">
        PHOTOS
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="148" y="60" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="16" 
          font-weight="500" 
          letter-spacing="0.3" 
          fill="#7C6B63">
      · Cloud Memori Privat &amp; Terenkripsi
    </text>
  </g>
</svg>
