<!DOCTYPE html>
<html>
<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
<title>Biyen Space</title>
<style>
  @media screen and (max-width: 480px) {
    .space-shell {
      padding-left: 12px !important;
      padding-right: 12px !important;
    }

    .space-card {
      padding-left: 18px !important;
      padding-right: 18px !important;
    }
  }

  .footer-icons {
    padding: 4px !important;
    width: 24px !important;
  }
</style>
</head>
<body style="background-color: #f0f1f3; color: #232323; font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; margin: 0; padding: 0; -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f0f1f3" style="background-color: #f0f1f3; border-collapse: collapse; margin: 0; width: 100%;">
  <tr>
    <td align="center" class="space-shell" style="padding: 40px 20px 0;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse: separate; border-spacing: 0; max-width: 420px; width: 100%;">
        <tr>
          <td align="center" class="space-card" bgcolor="#ffffff" style="background-color: #ffffff; border-radius: 24px; color: #232323; font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; padding: 30px 28px 24px; text-align: center;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse: collapse; width: 100%;">
              {{if .IllustrationURL}}
              <tr>
                <td align="center" style="padding: 0 0 24px;">
                  <img src="{{ .IllustrationURL }}" width="{{ .IllustrationWidth }}" alt="" style="border: 0; display: block; height: auto; margin: 0 auto; max-width: 100%; outline: none; text-decoration: none; width: {{ .IllustrationWidth }}px;" />
                </td>
              </tr>
              {{end}}
              <tr>
                <td align="left" style="color: #5f5f5f; font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; font-size: 15px; line-height: 22px; padding: 0 0 {{if .CTALabel}}22px{{else}}0{{end}}; text-align: left;">
                  {{range .BodyLines}}
                    <p style="margin: 0 0 12px;">{{.}}</p>
                  {{end}}
                </td>
              </tr>
              {{if .CTALabel}}
              <tr>
                <td align="center">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse: separate; border-spacing: 0; width: 100%;">
                    <tr>
                      <td align="center" bgcolor="#08C225" style="background-color: #08C225; border-radius: 16px;">
                        <a href="{{ .CTAURL }}" target="_blank" style="background-color: #08C225; border-radius: 16px; color: #ffffff !important; display: block; font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; line-height: 20px; padding: 16px 28px; text-align: center; text-decoration: none !important;">{{ .CTALabel }}</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              {{end}}
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<br />
<div class="footer" style="text-align: center; font-size: 12px; color: rgb(136, 136, 136)">
  <div style="padding: 16px 0;">
    <a href="https://biyen.levitation.web.id" target="_blank" style="text-decoration: none; font-weight: bold; font-size: 18px; color: #C8502E; letter-spacing: 1px;">
      BIYEN
    </a>
  </div>
  <p style="margin: 4px 0; color: #888;">
    Simpan dan rawat kenangan berharga dengan privasi mutlak.
  </p>
  <p style="margin: 8px 0; color: #aaa;">
    Biyen by Levitation · <a href="https://biyen.levitation.web.id" style="color: #888;">biyen.levitation.web.id</a>
  </p>
  <br />
</div>
</body>
</html>
