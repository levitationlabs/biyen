# Copy to /opt/biyen/museum.yaml on your VPS (next to biyen-compose.yml).
# Overrides configurations/production.yaml cleanly.

log-file: ""
log-level: info

http:
  port: 8080
  use-tls: false

apps:
  public-albums: https://albums-biyen.levitation.web.id
  accounts: https://accounts-biyen.levitation.web.id
  accounts-legacy: https://accounts-biyen.levitation.web.id

db:
  host: postgres
  port: 5432
  name: ente_db
  user: biyen_pg
  password: "CHANGE_ME_STRONG_DB_PASSWORD"
  sslmode: disable

# Generate using: go run tools/gen-random-keys/main.go
key:
  encryption: "CHANGE_ME_BASE64_32BYTE_KEY"
  hash: "CHANGE_ME_BASE64_64BYTE_KEY"
jwt:
  secret: "CHANGE_ME_BASE64_JWT_SECRET"

# Object storage (Cloudflare R2 / Backblaze B2 / S3)
# Keep key name "b2-eu-cen" even when pointing to R2 or another S3 provider.
s3:
  are_local_buckets: false
  use_path_style_urls: false
  b2-eu-cen:
    key: "CHANGE_ME_S3_ACCESS_KEY"
    secret: "CHANGE_ME_S3_SECRET_KEY"
    endpoint: "<ACCOUNT_ID>.r2.cloudflarestorage.com"
    region: "auto"
    bucket: "biyen-photos-prod"

# SMTP for OTP, recovery, suspension alerts, and inactive notices
# encryption: "tls" -> port 465 | encryption: "" -> port 587 STARTTLS
smtp:
  host: smtp.resend.com
  port: "465"
  username: "resend"
  password: "CHANGE_ME_SMTP_PASSWORD"
  email: "noreply@levitation.web.id"
  sender-name: "Biyen Photos"
  encryption: "tls"

# FOSSBilling bridge (must match Servicesaas -> App "biyen")
fossbilling:
  base-url: https://billing.levitation.web.id
  app-id: biyen
  shared-secret: "CHANGE_ME_64_HEX_CHARS"
  portal-url: https://billing.levitation.web.id/order/service
  max-drift-seconds: 300

webauthn:
  rpid: "accounts-biyen.levitation.web.id"
  rporigins:
    - "https://accounts-biyen.levitation.web.id"

internal:
  silent: false
  disable-registration: false
  admins:
    - 1580559962386434

replication:
  enabled: false

jobs:
  cron:
    skip: false
