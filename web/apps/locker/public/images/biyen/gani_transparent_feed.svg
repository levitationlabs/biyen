<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" height="100%">
  <defs>
    <linearGradient id="elephantSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="50%" stop-color="#EBE2D5"/>
      <stop offset="100%" stop-color="#D6C7B5"/>
    </linearGradient>

    <radialGradient id="earInner" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F7C9BC"/>
      <stop offset="70%" stop-color="#EEA896"/>
      <stop offset="100%" stop-color="#DE8C78"/>
    </radialGradient>

    <linearGradient id="bandanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA6842"/>
      <stop offset="60%" stop-color="#D95C38"/>
      <stop offset="100%" stop-color="#B84220"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD175"/>
      <stop offset="100%" stop-color="#E59430"/>
    </linearGradient>

    <filter id="charShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4A2818" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3A1708" flood-opacity="0.06"/>
    </filter>
  </defs>

  <g filter="url(#charShadow)">
    <!-- Ears -->
    <g transform="translate(145, 250) rotate(-12)">
      <ellipse cx="0" cy="0" rx="90" ry="105" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      <ellipse cx="10" cy="0" rx="64" ry="78" fill="url(#earInner)" opacity="0.85"/>
    </g>
    <g transform="translate(455, 250) rotate(12)">
      <ellipse cx="0" cy="0" rx="90" ry="105" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      <ellipse cx="-10" cy="0" rx="64" ry="78" fill="url(#earInner)" opacity="0.85"/>
    </g>

    <!-- Body -->
    <ellipse cx="300" cy="430" rx="155" ry="145" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
    <ellipse cx="300" cy="445" rx="110" ry="95" fill="#FAF5ED" opacity="0.6"/>

    <!-- Feet -->
    <g transform="translate(180, 540)">
      <ellipse cx="0" cy="0" rx="48" ry="32" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      <ellipse cx="0" cy="4" rx="34" ry="22" fill="#FAF5ED"/>
      <circle cx="-18" cy="2" r="7" fill="#E8D9C5"/><circle cx="0" cy="-4" r="8" fill="#E8D9C5"/><circle cx="18" cy="2" r="7" fill="#E8D9C5"/>
    </g>
    <g transform="translate(420, 540)">
      <ellipse cx="0" cy="0" rx="48" ry="32" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
      <ellipse cx="0" cy="4" rx="34" ry="22" fill="#FAF5ED"/>
      <circle cx="-18" cy="2" r="7" fill="#E8D9C5"/><circle cx="0" cy="-4" r="8" fill="#E8D9C5"/><circle cx="18" cy="2" r="7" fill="#E8D9C5"/>
    </g>

    <!-- Bandana -->
    <g transform="translate(300, 375)">
      <path d="M -115 -18 Q 0 10 115 -18 Q 0 75 -115 -18 Z" fill="url(#bandanaGrad)" stroke="#B84220" stroke-width="2"/>
      <ellipse cx="0" cy="28" rx="14" ry="10" fill="#EA6842"/>
      <path d="M -8 32 L -18 64 L 0 54 L 18 64 L 8 32 Z" fill="#D95C38"/>
      <circle cx="-50" cy="0" r="5" fill="url(#amberGlow)"/><circle cx="50" cy="0" r="5" fill="url(#amberGlow)"/>
    </g>

    <!-- Head -->
    <circle cx="300" cy="240" r="135" fill="url(#elephantSkin)" stroke="#CFBEAA" stroke-width="3"/>
    
    <!-- Happy Smiling Curved Eyes (Closed in Pure Joy) -->
    <path d="M 230 220 Q 250 200 270 220" fill="none" stroke="#2C201A" stroke-width="5" stroke-linecap="round"/>
    <path d="M 330 220 Q 350 200 370 220" fill="none" stroke="#2C201A" stroke-width="5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="210" cy="255" rx="22" ry="14" fill="#F48F78" opacity="0.8"/>
    <ellipse cx="390" cy="255" rx="22" ry="14" fill="#F48F78" opacity="0.8"/>
    <path d="M 285 285 Q 300 302 315 285" fill="none" stroke="#7C4632" stroke-width="3.5" stroke-linecap="round"/>

    <!-- TRUNK HUGGING A BIG HEART PHOTO ALBUM -->
    <g id="albumTrunk">
      <!-- Album Book -->
      <g transform="translate(235, 290) rotate(-6)">
        <rect x="0" y="0" width="130" height="150" rx="14" fill="#C8502E" stroke="#A53C1F" stroke-width="2"/>
        <rect x="12" y="10" width="106" height="130" rx="8" fill="#FFFDF8"/>
        <!-- Heart of Memories -->
        <path d="M 65 75 C 65 75, 40 55, 40 40 C 40 28, 50 22, 58 30 C 65 37, 65 37, 65 37 C 65 37, 65 37, 72 30 C 80 22, 90 28, 90 40 C 90 55, 65 75, 65 75 Z" fill="#C8502E"/>
        <line x1="30" y1="95" x2="100" y2="95" stroke="#EADBCA" stroke-width="3" stroke-linecap="round"/>
        <line x1="40" y1="110" x2="90" y2="110" stroke="#EADBCA" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Trunk Wrapping Gently around Album -->
      <path d="M 285 270 
               Q 275 330 305 385 
               Q 350 425 390 380 
               Q 410 350 385 330 
               Q 360 320 350 350" 
            fill="none" 
            stroke="url(#elephantSkin)" 
            stroke-width="34" 
            stroke-linecap="round"/>
    </g>

    <!-- Floating Heart Sparks -->
    <g transform="translate(140, 160) scale(0.8)">
      <path d="M 15 25 C 15 25, 0 15, 0 7 C 0 2, 5 0, 9 3 C 15 7, 15 7, 15 7 C 15 7, 15 7, 21 3 C 25 0, 30 2, 30 7 C 30 15, 15 25, 15 25 Z" fill="#D98226"/>
    </g>
    <g transform="translate(460, 170) scale(0.9)">
      <path d="M 15 25 C 15 25, 0 15, 0 7 C 0 2, 5 0, 9 3 C 15 7, 15 7, 15 7 C 15 7, 15 7, 21 3 C 25 0, 30 2, 30 7 C 30 15, 15 25, 15 25 Z" fill="#C8502E"/>
    </g>
  </g>
</svg>
